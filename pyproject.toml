[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "script2video"
version = "0.1.0"
description = "Turn a written script into a narrated video with slides, SVG, Blender and Godot visuals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "abh3po" }]
keywords = ["video", "tts", "blender", "godot", "ffmpeg", "text-to-speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pyyaml>=6",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/abh3po/script2video"
Repository = "https://github.com/abh3po/script2video"

[project.optional-dependencies]
qwen = ["qwen-tts"]
edge = ["edge-tts"]
piper = ["piper-tts"]
svg = ["cairosvg"]

[project.scripts]
s2v = "s2v.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["s2v*"]
